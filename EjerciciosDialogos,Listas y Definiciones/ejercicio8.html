<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        dialog {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            padding: 20px;
            width: 350px;
        }

        summary {
            cursor: pointer;

            font-weight: bold;
        }

        button {
            margin-top: 15px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>


</head>

<body>
    <h2>Bienvenido</h2>
    <p>Si tienes dudas, abre el centro de ayuda</p>


    <p><button id="abrir">Abrir diálogo</button></p>
    <dialog id="miDialogo">
        <h2>Centro de Ayuda</h2>
        <p>Este es un mensaje dentro del cuadro de diálogo.</p>
        <details>
            <summary>¿Qué es este sitio</summary>
            <p>Este sitio es un centro de ayuda</p>
        </details>
        <details>
            <summary>¿Como cierro este cuadro?</summary>
            <p>Pulsa el botón cerrar</p>
        </details>
        <details>
            <summary>¿Qué tecnologias se usan?</summary>
            <p>HTML, CSS y JavaScript</p>
        </details>
        <button id="cerrar">Cerrar</button>
    </dialog>

    <script>
        const dialogo = document.getElementById("miDialogo");
        document.getElementById("abrir").addEventListener("click", () => dialogo.showModal());
        document.getElementById("cerrar").addEventListener("click", () => dialogo.close());
    </script>

</body>

</html>
