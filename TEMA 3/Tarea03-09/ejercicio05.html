<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>

<body>

    <h1>Ejercicio 5</h1>

    <svg viewBox="0 0 200 200" width="400" xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink">
        <defs>
            <linearGradient id="myGradient" gradientTransform="rotate(90, 0.5, 0.5)">
                <stop offset="5%" stop-color="gold" />
                <stop offset="95%" stop-color="red" />
            </linearGradient>
            <linearGradient id="myGradient2" gradientTransform="rotate(270, 0.5, 0.5)">
                <stop offset="5%" stop-color="gold" />
                <stop offset="95%" stop-color="red" />
            </linearGradient>
        </defs>
        <!-- using my linear gradient -->
        <circle cx="100" cy="100" r="75" fill="url(#myGradient)" />
        <circle cx="100" cy="100" r="60" fill="url(#myGradient2)" />
        <circle cx="100" cy="100" r="35" fill="url(#myGradient)" />
        <circle cx="100" cy="100" r="20" fill="url(#myGradient2)" />
    </svg>

</body>

</html>
