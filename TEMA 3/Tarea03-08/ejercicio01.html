<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>

<body>

    <h1>Ejercicio 1</h1>

    <h2>1. Rectangulo</h2>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 150">
        <rect x="10" y="10" width="50" height="30" />
        <rect x="60" y="10" rx="10" ry="10" width="50" height="30" />

    </svg>

    <h2>2. Circulo</h2>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="-100 -100 200 200">
        <circle cx="0" cy="0" r="75" fill="none" stroke="red" stroke-width="5" />
        <circle cx="0" cy="0" r="50" fill="none" stroke="blue" stroke-width="5" />
        <circle cx="0" cy="0" r="25" fill="none" stroke="green" stroke-width="5" />
    </svg>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="100" height="100" style="background-color: lightgray">
        <circle cx="50" cy="50" r="50" fill="none" stroke="red" stroke-width="1" />
    </svg>
    <br>

    <h2>3. Elipse</h2>

    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <ellipse cx="100" cy="50" rx="100" ry="50" />
    </svg>

    <h2>4. Line</h2>

    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">

        <line x1="10" x2="50" y1="110" y2="150" stroke="black" stroke-width="5" />

    </svg>

    <h2>5. PolyLine</h2>

    <svg viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg">
        <polyline points="0,100 50,25 50,75 100,0" fill="red" />
        <polyline points="100,100 150,25 150,75 200,0" fill="none" stroke="black" />
    </svg>

    <h2>6. Path</h2>

    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <path fill="none" stroke="green" d="M20,50 C20,-50 180,150 180,50 C180-50 20,150 20,50 z" />
    </svg>


</body>

</html>
