<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
</head>

<body>

    <h1>Primer svg</h1>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="205" height="205" viewBox="-205 -205 405 405"
        style="background-color: lightgray">
        <circle cx="0" cy="0" r="100" fill="none" stroke="red" stroke-width="1" />
        <line x1="-200" y1="0" x2="200" y2="0" stroke="black" stroke-width="1" />
        <line x1="0" y1="-200" x2="0" y2="200" stroke="black" stroke-width="1" />
    </svg>

    <h1>2º SVG</h1>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="105" height="105" viewBox="0 0 105 105"
        style="background-color: lightgray">
        <circle cx="0" cy="0" r="100" fill="none" stroke="red" stroke-width="1" />
        <line x1="-200" y1="0" x2="200" y2="0" stroke="black" stroke-width="1" />
        <line x1="0" y1="-200" x2="0" y2="200" stroke="black" stroke-width="1" />
    </svg>

    <h1>3º SVG</h1>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="-100 -100 200 200"
        style="background-color: lightgray">
        <circle cx="0" cy="0" r="100" fill="none" stroke="red" stroke-width="1" />
        <line x1="-200" y1="0" x2="200" y2="0" stroke="black" stroke-width="1" />
        <line x1="0" y1="-200" x2="0" y2="200" stroke="black" stroke-width="1" />
    </svg>

    <h1>4º SVG</h1>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="-95 -95 190 190"
        style="background-color: lightgray">
        <circle cx="-50" cy="0" r="40" fill="none" stroke="blue" stroke-width="2" />
        <circle cx="50" cy="0" r="40" fill="none" stroke="blue" stroke-width="2" />
        <circle cx="0" cy="-50" r="40" fill="none" stroke="green" stroke-width="2" />
        <circle cx="0" cy="50" r="40" fill="none" stroke="green" stroke-width="2" />
        <circle cx="0" cy="0" r="40" fill="none" stroke="red" stroke-width="2" />
    </svg>

    <h1>5º SVG</h1>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="220" height="170" viewBox="-10 -10 220 170">
        <circle cx="75" cy="75" r="75" fill="red" />
        <circle cx="100" cy="75" r="75" fill="none" stroke="yellow" />
        <circle cx="125" cy="75" r="75" fill="mediumseagreen" />
    </svg>

    <h1>6º SVG</h1>

    <img src="svg.svg">

    <h1>Ejercicio 2</h1>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="-125 -125 250 250">
        <circle cx="0" cy="0" r="150" fill="red" />
        <circle cx="0" cy="0" r="100" fill="mediumseagreen" />
    </svg>

    <h1>Ejercicio 3</h1>
    <p>Crea un svg que aparezcan cinco circulos de colores degradados de rojo
        (fill:#550000, fill:880000, fill:AA0000, fill:CC0000,fill:FF0000) cuyo rx se vaya desplazando 25 y
        su radio vaya creciendo de 5 en 5.</p>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="-50 -100 200 200" style="background-color: aqua;">
        <circle cx="5" cy="0" r="10" fill="#550000" />
        <circle cx="25" cy="0" r="15" fill="#880000" />
        <circle cx="50" cy="0" r="20" fill="#AA0000" />
        <circle cx="75" cy="0" r="25" fill="#CC0000" />
        <circle cx="100" cy="0" r="30" fill="#FF0000" />
    </svg>

</body>

</html>
