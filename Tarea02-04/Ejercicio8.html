<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
</head>

<body>

    <h1>Ejercicio 8 incrustar HTML a pdf</h1>
    <h3>Crea un pdf con el html anterior e incrustalo en la web de las tres maneras diferentes</h3>

    <h2>1. Con iframe</h2>
    <iframe src="BAC_GFW_Manint_ENG_102011.pdf" width="800" height="600">
    </iframe>

    <h2>2. Con embed</h2>
    <embed src="BAC_GFW_Manint_ENG_102011.pdf" type="application/pdf" width="800" height="600">

    <h2>3. Con object</h2>
    <object data="BAC_GFW_Manint_ENG_102011.pdf" type="application/pdf" width="800" height="600">
        <p>
            Tu navegador no puede mostrar el PDF.
            <a href="BAC_GFW_Manint_ENG_102011.pdf">Descargar PDF</a>
        </p>
    </object>

</body>

</html>
