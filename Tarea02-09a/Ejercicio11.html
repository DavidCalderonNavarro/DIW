<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>

<body>


    <table style="width: 80%; margin-left: auto; margin-right: auto; border: red 1px solid;">

        <tr>
            <td colspan="3">
                <h1>Escoge el sistema de envío</h1>
            </td>
        </tr>

        <tr>
            <td style="border: red 1px solid; text-align: center;">
                <label for="buscar">Buscar archivo</label>
                <input type="text" id="buscar" name="buscar" placeholder="Web a buscar">
                <br><br>

                <label for="tematica">Temática del formulario</label>
                <input type="text" id="tematica" name="tematica">
            </td>

            <td style="border: blue 1px solid; text-align: center;">
                <label for="archivo">Subir ficheros</label>
                <input type="file" id="archivo" name="archivo">
            </td>

            <td style="border: red 1px solid; text-align: center;">
                <label for="web">Escoger web</label>
                <input type="url" id="web" name="web" placeholder="Escribe una URL correcta">
            </td>
        </tr>

        <tr>
            <td>
                <button type="submit">Enviar</button>
            </td>
        </tr>

    </table>

</body>

</html>
