    <!DOCTYPE html>
    <html lang="es">

    <head>
        <meta charset="UTF-8">
        <title>Formulario GET</title>
    </head>

    <body>

        <h2>Formulario</h2>

        <form action="" method="get">

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
            <br><br>

            <p>Selecciona tu curso:</p>

            <input type="radio" id="curso1" name="curso" value="1">
            <label for="curso1">1º DAW</label>

            <input type="radio" id="curso2" name="curso" value="2">
            <label for="curso2">2º DAW</label>

            <input type="radio" id="curso3" name="curso" value="3">
            <label for="curso3">1º DAM</label>

            <input type="radio" id="curso4" name="curso" value="4">
            <label for="curso4">2º DAM</label>
            <br><br>

            <p>Selecciona tus aficiones:</p>

            <input type="checkbox" id="deporte" name="aficiones" value="deporte">
            <label for="deporte">Deporte</label>

            <input type="checkbox" id="musica" name="aficiones" value="musica">
            <label for="musica">Música</label>
            <br><br>

            <label for="archivo">Selecciona un archivo:</label>
            <input type="file" id="archivo" name="archivo">
            <br><br>

            <button type="submit">Enviar</button>

        </form>

    </body>

    </html>


</body>
