<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
</head>

<body>

    <form action="resultado.html" method="get">

        <label for="nombre">Dime tu nombre</label><br>
        <input type="text" id="nombre" name="nombre">
        <br><br>

        <label for="apellidos">Dime tus apellidos</label><br>
        <input type="text" id="apellidos" name="apellidos">
        <br><br>

        <label for="numero">Número de personas</label>
        <input type="number" id="numero" name="numero">
        <br><br>


        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono">
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="fecha">Fecha de envio</label>
        <input type="date" id="fecha" name="fecha">
        <br><br>

        <label for="hora">Hora de envio</label>
        <input type="time" id="hora" name="hora">
        <br><br>

        <button type="submit">Enviar</button>

    </form>

</body>

</html>
