<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 4 - Datalist y meter</title>
</head>

<body>
  <form action="recogida.php" method="get">
    <h1>Formulario Meter</h1>
    <fieldset>
      <legend>Genera tu personaje para el juego</legend>
      <label for="nombre">Nombre:</label><input type="text" id="nombre" name="nombre"><br>
      <label for="faccion">Valoración:</label>
      <input type="text" id="faccion" name="faccion" list="listaFacciones" placeholder="Pulsa para facciones"
        onchange="aplicaFaccion()">
      <datalist id="listaFacciones">
        <option value="Guerrero">
        <option value="Mago">
        <option value="Ladrón">
        <option value="Paladín">
      </datalist>
      <p><label for="edadp" style="min-width:0">Escoge la edad</label><br>
        <input type="range" id="edadp" name="edadp" min="1" max="100" value="40">
      </p>
      <button type="button" onclick="aplicaFaccion()">Genera tu personaje</button>
    </fieldset>

    <fieldset class="stat">
      <legend>Datos del personaje</legend>
      <div><meter id="Fuerza" min="0" max="200" low="60" high="150" optimum="200" value="30"></meter> Fuerza</div>
      <div><meter id="Velocidad" min="0" max="200" low="60" high="150" optimum="200" value="30"></meter> Velocidad</div>
      <div><meter id="Persuasion" min="0" max="200" low="60" high="150" optimum="200" value="30"></meter> Persuasión
      </div>
      <div><meter id="Espionaje" min="0" max="200" low="60" high="150" optimum="200" value="30"></meter> Espionaje</div>
    </fieldset>
  </form>

  <script>
    // Valor base de cada estadística según la facción: [Fuerza, Velocidad, Persuasión, Espionaje]
    var perfiles = {
      "guerrero": [180, 90, 30, 20],
      "mago": [30, 60, 170, 80],
      "ladrón": [70, 170, 80, 180],
      "paladín": [140, 60, 150, 20]
    };
    var ids = ["Fuerza", "Velocidad", "Persuasion", "Espionaje"];

    function aplicaFaccion() {
      var faccion = document.getElementById("faccion").value.trim().toLowerCase();
      var base = perfiles[faccion];
      for (var i = 0; i < ids.length; i++) {
        var valor;
        if (base) {
          // Perfil de la facción con una pequeña variación aleatoria (±20)
          valor = Math.min(200, Math.max(0, base[i] + (Math.random() * 40 - 20)));
        } else {
          // Sin facción válida: valores totalmente aleatorios
          valor = Math.random() * 200;
        }
        document.getElementById(ids[i]).value = valor;
      }
    }
  </script>
</body>

</html>
