<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 1 - Fieldset</title>
</head>

<body>
  <form action="recogida.php" method="get"
    style="width: 400px; margin-left:auto; margin-right:auto; background-color: beige; border-color:brown; border: 1px solid red; border-radius:6px;">
    <h1>Formulario 3</h1>
    <fieldset>
      <legend>Datos personales</legend>
      <label for="nombre">Nombre:</label><input type="text" id="nombre" name="nombre"><br>
      <label for="apellido">Apellido:</label><input type="text" id="apellido" name="apellido"><br>
      <label for="edad">Edad:</label><input type="number" id="edad" name="edad"><br>
      <label for="satisfaccion">Seleccione tu satisfacción Con el concierto</label><br>
      <input type="range" id="satisfaccion" name="satisfaccion" min="0" max="10" value="7">
    </fieldset>
    <input type="submit" value="Gracias por tus Opiniones">
  </form>
</body>

</html>
